[tool.ruff]
target-version = "py313"
# alembic/versions holds append-only autogenerated migrations - linting/
# reformatting frozen history adds churn for no benefit. env.py stays linted.
exclude = ["venv", ".pytest_cache", "alembic/versions"]

[tool.ruff.lint]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# This codebase deliberately stores and compares naive UTC datetimes
# (see app/utils/time.py) - flake8-datetimezone rules fight that in tests
# that build fixed timestamps for ordering assertions.
"tests/**" = ["DTZ001"]

[tool.mypy]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", "venv"]
