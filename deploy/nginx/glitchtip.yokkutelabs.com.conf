# Copié vers /etc/nginx/sites-available/ + symlink dans sites-enabled/.
# `certbot --nginx` complète ce fichier (443 + redirection 80->443) au
# premier passage. Voir docs/RUNBOOK.md.
#
# GlitchTip n'est PAS public : ce vhost n'expose que les chemins de
# réception d'erreurs (nécessaires — les SDK client-side et le backend
# doivent pouvoir y poster). Le dashboard/login restent accessibles
# uniquement via tunnel SSH sur 127.0.0.1:3001 (cf. RUNBOOK §8), jamais
# via ce domaine.

server {
    listen 80;
    listen [::]:80;
    server_name glitchtip.yokkutelabs.com;

    include /etc/nginx/snippets/beta-security-headers.conf;

    # Ingestion d'événements (store/envelope legacy + endpoints modernes) et
    # rapports CSP/security — les seuls chemins qu'un SDK ou un navigateur
    # a besoin d'atteindre depuis l'extérieur.
    location ~ ^/api/[0-9]+/(store|envelope|security)/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
