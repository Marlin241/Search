# Copié vers /etc/nginx/sites-available/ + symlink dans sites-enabled/.
# Ancien domaine, conservé uniquement pour rediriger les liens déjà partagés
# vers le domaine définitif (search.yokkutelabs.com). Le certificat TLS
# existant (émis avant le renommage) reste valide pour ce domaine.

server {
    listen 80;
    listen [::]:80;
    server_name beta.yokkutelabs.com;

    include /etc/nginx/snippets/beta-security-headers.conf;

    location / {
        return 301 https://search.yokkutelabs.com$request_uri;
    }
}
