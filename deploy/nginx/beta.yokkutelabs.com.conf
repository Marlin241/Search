# Ancien domaine, conservé uniquement pour rediriger les liens déjà partagés
# vers le domaine définitif (search.yokkutelabs.com). Bloc 443 nécessaire
# (pas seulement le 80) car les navigateurs qui ont déjà visité ce domaine
# ont HSTS en cache et ne tentent jamais le port 80. Réutilise le
# certificat déjà émis pour beta.yokkutelabs.com + api.beta.yokkutelabs.com
# (pas de renouvellement de ce côté — laisser expirer avec le reste du VPS
# une fois qu'il n'y a plus de trafic dessus).

server {
    listen 80;
    listen [::]:80;
    server_name beta.yokkutelabs.com;
    return 301 https://search.yokkutelabs.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beta.yokkutelabs.com;

    ssl_certificate /etc/letsencrypt/live/beta.yokkutelabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.yokkutelabs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://search.yokkutelabs.com$request_uri;
}
