# Copié vers /etc/nginx/sites-available/ + symlink dans sites-enabled/.
# `certbot --nginx` complète ce fichier (443 + redirection 80->443) au
# premier passage. Voir docs/RUNBOOK.md.

server {
    listen 80;
    listen [::]:80;
    server_name beta.yokkutelabs.com;

    include /etc/nginx/snippets/beta-security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
