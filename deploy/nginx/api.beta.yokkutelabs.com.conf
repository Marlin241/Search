# Ancien domaine, conservé uniquement pour rediriger les appels déjà en
# circulation vers le domaine définitif (api.search.yokkutelabs.com). Bloc
# 443 nécessaire (pas seulement le 80) car les clients qui ont déjà appelé
# ce domaine ont potentiellement HSTS en cache. Réutilise le certificat déjà
# émis pour beta.yokkutelabs.com + api.beta.yokkutelabs.com.

server {
    listen 80;
    listen [::]:80;
    server_name api.beta.yokkutelabs.com;
    return 301 https://api.search.yokkutelabs.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.beta.yokkutelabs.com;

    ssl_certificate /etc/letsencrypt/live/beta.yokkutelabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.yokkutelabs.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://api.search.yokkutelabs.com$request_uri;
}
