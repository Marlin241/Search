# Copié vers /etc/nginx/sites-available/ + symlink dans sites-enabled/.
# `certbot --nginx` complète ce fichier (443 + redirection 80->443) au
# premier passage. Voir docs/RUNBOOK.md.

server {
    listen 80;
    listen [::]:80;
    server_name api.beta.yokkutelabs.com;

    include /etc/nginx/snippets/beta-security-headers.conf;

    # Upload de CV (multipart) — cohérent avec la validation applicative (5 Mo
    # + marge). nginx doit accepter au moins autant que le backend.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Générations synchrones éventuelles (diagnostic ATS).
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
