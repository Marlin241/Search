# Copié vers /etc/nginx/sites-available/ + symlink dans sites-enabled/.
# Ancien domaine, conservé uniquement pour rediriger les appels déjà en
# circulation vers le domaine définitif (api.search.yokkutelabs.com). Le
# certificat TLS existant (émis avant le renommage) reste valide pour ce
# domaine.

server {
    listen 80;
    listen [::]:80;
    server_name api.beta.yokkutelabs.com;

    include /etc/nginx/snippets/beta-security-headers.conf;

    location / {
        return 301 https://api.search.yokkutelabs.com$request_uri;
    }
}
